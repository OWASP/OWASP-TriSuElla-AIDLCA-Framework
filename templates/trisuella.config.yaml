# TriSuElla-AIDLCA Project Configuration (v3.0)
# Place in repository root to customize policy enforcement

version: "3.0"
project_name: "enterprise-ai-application"
risk_tier: "Tier-1" # Tier-1 (High Assurance / Regulated), Tier-2 (Standard Enterprise), Tier-3 (Internal Prototype)

governance:
  audit_file: "./audit.md"
  state_file: "./TRISUELLA-AIDLCA-state.md"
  blocking_severities:
    - "CRITICAL"
    - "HIGH"

active_extensions:
  base_security: true         # OWASP Top 10 API & Web Baseline
  ai_agentic: true            # OWASP LLM Top 10, Semantic Guardrails, Tool-Use Sandboxing
  sensitive_data: true        # PII Redaction, L0-L4 Data Classification
  zero_trust: true            # SPIFFE/mTLS Workload Identity, Least Privilege
  infra_cloud: true           # Container & Cloud Security Posture (CIS/NIST)
  compliance:
    dpdpa_india: true         # Digital Personal Data Protection Act (2023)
    rbi_bfsi: false           # Reserve Bank of India AI & Cyber Resilience Directives
    gdpr_eu: false            # EU General Data Protection Regulation
    iso_42001: true           # Artificial Intelligence Management System (AIMS)

enforcement_gates:
  pre_commit: true
  ci_cd_pr_blocking: true
  dual_key_deployment: true

# Multi-Cloud Full-Spectrum CSPM & Auditing Configuration (TRISU-CSPM)
cspm:
  enabled: true
  audit_interval: "continuous" # continuous, hourly, daily
  compliance_benchmarks:
    - "CIS-Level-2"
    - "NIST-SP-800-53-Rev5"
    - "ISO-27001-2022"
    - "TRISU-CSPM-v3.0"
  providers:
    aws:
      enabled: true
      cspm_engine: "SecurityHub"
      enforce_worm_locks: true
      strict_workload_iam: true
      kspm_eks_private: true
      dspm_rds_cmek: true
      imdsv2_required: true
    azure:
      enabled: true
      cspm_engine: "DefenderForCloud"
      enforce_blob_immutability: true
      strict_managed_identities: true
      kspm_aks_private: true
      dspm_purview_audit: true
      trusted_launch_required: true
    gcp:
      enabled: true
      cspm_engine: "SecurityCommandCenter"
      enforce_bucket_locks: true
      strict_workload_identity: true
      kspm_gke_binary_auth: true
      dspm_dlp_scan: true
      shielded_vms_required: true
    alibaba_cloud:
      enabled: true
      cspm_engine: "CloudSecurityCenter"
      enforce_oss_compliance_mode: true
      strict_ram_roles_oidc: true
      actiontrail_multi_region: true
      kspm_ack_private: true
      dspm_polardb_tde: true
      ecs_imdsv2_required: true
    oci:
      enabled: true
      cspm_engine: "CloudGuard"
      enforce_retention_rules: true
      strict_instance_principals: true
      kspm_oke_private: true
      dspm_data_safe: true
      shielded_instances_required: true
  posture_domains:
    kspm:
      enforce_private_control_plane: true
      pod_security_standard: "Restricted"
      require_image_signatures: true
    dspm:
      prohibit_public_database_endpoints: true
      enforce_cmk_encryption_at_rest: true
      require_daily_worm_backups: true
    ai_cspm:
      enforce_imdsv2_hop_limit_1: true
      isolate_ai_model_endpoints: true
      prohibit_plaintext_serverless_secrets: true
    ciem:
      revoke_dormant_credentials_days: 90
      prohibit_wildcard_permissions: true
      max_permissions_creep_index: 15
    edge_waf:
      enforce_waf_blocking_mode: true
      owasp_core_rule_set: true
      anti_ddos_protection: true
    shift_left_iac:
      enforce_ci_cd_preflight_scan: true
      scanner_tools: ["checkov", "tfsec", "trivy"]
      fail_on_severities: ["CRITICAL", "HIGH"]
  sovereign_geofencing:
    enabled: true
    allowed_regions:
      aws: ["ap-south-1", "ap-south-2"]
      azure: ["centralindia", "southindia"]
      gcp: ["asia-south1", "asia-south2"]
      alibaba_cloud: ["ap-south-1", "me-central-1"]
      oci: ["ap-hyderabad-1", "ap-mumbai-1"]
# Application-Level Zero Trust Code Invariants (TRISU-ZTC)
zero_trust_code:
  enabled: true
  enforce_explicit_boundary_validation: true    # TRISU-ZTC-01
  require_object_level_authorization: true      # TRISU-ZTC-02 (BOLA/IDOR prevention)
  prohibit_ambient_credentials: true            # TRISU-ZTC-03
  enforce_fail_closed_execution: true           # TRISU-ZTC-04
  disallow_insecure_deserialization: true       # TRISU-ZTC-05 (banning eval/exec/pickle)
  require_in_code_audit_telemetry: true         # TRISU-ZTC-06
  prohibit_unsafe_shell_execution: true         # TRISU-ZTC-07 (banning shell=True and raw os.system)
  enforce_agent_tool_confinement: true          # TRISU-ZTC-08 (HITL gating and schema bounds)

# Open Source Security (OSS) & Software Supply Chain Governance (TRISU-OSS)
open_source_security:
  enabled: true
  profile: "OSS-2"                              # OSS-1 | OSS-2 | OSS-3
  enforce_lockfile_pinning: true                # TRISU-OSS-01 (exact version + sha256 hash pinning)
  fail_on_cvss_threshold: 7.0                   # TRISU-OSS-02 (block CVSS >= 7.0 and CISA KEV)
  prohibit_copyleft_licenses: true              # TRISU-OSS-03 (prohibit AGPL/GPL contamination)
  prevent_dependency_confusion: true            # TRISU-OSS-04 (enforce namespace scoping @org/)
  generate_cyclonedx_sbom: true                 # TRISU-OSS-05 (CycloneDX v1.6 AI-BoM)
  enforce_slsa_provenance: false                # TRISU-OSS-06 (SLSA Level 2+ Cosign attestation)

# Shadow AI Discovery & Auditing Governance (TRISU-SHADOW)
shadow_ai_governance:
  enabled: true
  enforce_ai_bom_reconciliation: true           # TRISU-SHADOW-01: Block build if source imports undeclared AI models
  allowed_model_suppliers:                      # TRISU-SHADOW-02: Sanctioned model supplier whitelist
    - "Anthropic"
    - "Google"
    - "AzureOpenAI"
    - "Internal"
  require_enterprise_gateway: true              # TRISU-SHADOW-03: Prohibit direct public LLM vendor URLs
  enterprise_gateway_url: "https://ai-gateway.internal.corp/v1"
  enforce_approval_attestation: true            # TRISU-SHADOW-04: Mandatory trisuella:approval_ref in AI-BoM
  enforce_agent_confinement: true               # TRISU-SHADOW-05: Confine agent tool loops with HITL
  catalog_vector_stores: true                   # TRISU-SHADOW-06: Ensure vector stores are in AI-BoM data components

# Data Literacy, Lineage, Integrity & Quality Assurance (TRISU-DLIT)
data_literacy_governance:
  enabled: true
  enforce_provenance_attestation: true          # TRISU-DLIT-01: Cryptographic lineage & licensing attestation
  enforce_production_data_air_gap: true         # TRISU-DLIT-02: Block raw DB dumps & unmasked PII/SPI in non-prod
  enforce_vector_pre_retrieval_acl: true        # TRISU-DLIT-03: Mandatory pre-retrieval filters in RAG vector search
  enforce_data_quality_integrity: true          # TRISU-DLIT-04: Schema validation, drift monitoring & profiling
  enforce_right_to_be_forgotten: true           # TRISU-DLIT-05: Verifiable unlearning & selective purging mechanism
  enforce_differential_privacy: true           # TRISU-DLIT-06: Differential privacy & sanitization before embedding
  enforce_consent_attestation: true             # TRISU-DLIT-07: Explicit lawful consent basis and lineage linkage
  enforce_vector_store_poisoning_audit: true    # TRISU-DLIT-08: Continuous vector index integrity & poisoning audit


